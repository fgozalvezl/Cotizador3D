name: release

# Publica un Release de GitHub con el .exe adjunto. Se dispara de dos formas:
#  - pusheando un tag vX.Y.Z, o
#  - manualmente (workflow_dispatch) indicando la version: en ese caso el
#    propio workflow crea el tag sobre el commit elegido.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar, por ejemplo v2.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Cotizador3D.sln -c Release
      - run: dotnet publish src/Cotizador3D.App/Cotizador3D.App.csproj -c Release -o publish
      - name: Empaquetar
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Cotizador3D.exe, publish/LatoFont -DestinationPath "Cotizador3D-$env:VERSION-win-x64.zip"
      - name: Crear release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:VERSION" `
            "publish/Cotizador3D.exe" `
            "Cotizador3D-$env:VERSION-win-x64.zip" `
            --target "${{ github.sha }}" `
            --title "Cotizador3D $env:VERSION" `
            --generate-notes
